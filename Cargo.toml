[workspace]
members = ["crates/*"]
default-members = ["crates/vinput"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/lrakar/vinput-oss"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
vinput-core = { path = "crates/vinput-core" }
vinput-host = { path = "crates/vinput-host" }
vinput-ui = { path = "crates/vinput-ui" }
vinput-view = { path = "crates/vinput-view" }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_UI_Shell", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"

# The shipping profile: `scripts/release.ps1` and the size check in CI build
# with it. The executable is downloaded by every user and stays resident, and
# it waits on the network and on Windows rather than on the processor, so it
# is built for size. Measure before changing any of this (`cargo size`), and
# keep `ci.yml`'s budget in step.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

# Encrypts every byte on the wire and checks multi-gigabyte model downloads.
[profile.release.package.ring]
opt-level = 3

# Everyday builds: enough to get file and line in a backtrace of our own
# code, and nothing to write out for the dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
