[package]
name = "vinput-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Vinput engine: audio, speech recognition, typing, settings and the local API, with no window code"
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
googleapis-tonic-google-cloud-speech-v2 = "0.37.0"
putlab-core.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The TLS half of connecting a WebSocket, which `stt/live.rs` does by
# itself; the same crate tokio-tungstenite and tonic already bring.
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
# Reads the roots Windows trusts for the speech streams; see `tls` in
# `stt/live.rs`.
rustls-native-certs = "0.8"

[target."cfg(windows)".dependencies]
# The power feature is for hearing that the PC woke up (`audio/wasapi.rs`).
windows = { workspace = true, features = ["Win32_System_Power"] }
# Named by the code `windows::core::implement` writes.
windows-core.workspace = true
windows-sys.workspace = true

[features]
# For the tests of the other crates, which ask for it among their
# dev-dependencies: without a VINPUT_INSTANCE the engine then runs as the
# separate copy "tests" (see src/instance.rs), so that no test writes to the
# log or the settings of the Vinput on this PC, shows a notification or
# plays a sound. Never among the dependencies of anything that ships.
test-instance = ["putlab-core/test-instance"]

# The crate's own tests run as that separate copy too, and use the stand-in
# for the account's server.
[dev-dependencies]
putlab-core = { workspace = true, features = ["test-instance", "fake"] }

[lints]
workspace = true
