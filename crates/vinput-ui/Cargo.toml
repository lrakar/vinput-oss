[package]
name = "vinput-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Vinput windows: Settings, the update window and setup. Knows the contract in vinput-view and nothing about the engine"
repository.workspace = true
publish.workspace = true

[dependencies]
vinput-view.workspace = true

[target."cfg(windows)".dependencies]
windows.workspace = true
windows-core.workspace = true
windows-numerics.workspace = true

[features]
# The pages of each program of the family. An executable carries only the
# ones it asks for: Vinput its own, which is what a crate that says nothing
# gets, and the programs under apps/ theirs, with the default turned off.
default = ["vinput"]
vinput = ["pickers", "line"]
hub = ["vinput-view/hub"]
voutput = ["vinput-view/voutput", "pickers", "line"]
# The line to the background process that started a window process: what
# the window shows comes in over it and what the user does goes out, as
# text. The windows of Vinput and Voutput are fed that way. The hub is its
# own window and its own backend, and without this carries none of what
# reads and writes that text.
line = []
# The parts of a page that pick from a long list: a row that opens, a list
# that scrolls by itself, chips, a list that is searched. Vinput and Voutput
# have such pages. The hub has none, and without this its executable carries
# none of what lays them out, paints them and works them; see `Pickers` in
# node.rs for how.
pickers = []

[lints]
workspace = true
